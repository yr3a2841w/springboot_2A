<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

    <h1>Book List</h1>

	<h2>検索条件</h2>
	<form onsubmit="onSearch(event)" id="search-form">
		<input type="text" id="search-title" placeholder="タイトル">
		<input type="text" id="search-author" placeholder="著者">
		<input type="text" id="search-publisher" placeholder="出版社">
		<input type="number" id="search-minStock" placeholder="在庫数以上">
		<input type="text" id="search-publishedDate" placeholder="出版日（例：2025、2025-08）">
		<button type="submit">検索</button>
		<button type="button" onclick="resetSearch()">リセット</button>
	</form>
	
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th onclick="sortTable('title')">タイトル</th>
                <th onclick="sortTable('author')">著者</th>
                <th onclick="sortTable('publisher')">出版社</th>
                <th onclick="sortTable('publishedDate')">出版日</th>
                <th onclick="sortTable('stock')">在庫数</th>
                <th sec:authorize="hasRole('ADMIN')">操作</th>
            </tr>
        </thead>
        <tbody id="book-table-body">
            <!-- JavaScriptでデータを挿入 -->
        </tbody>
    </table>

	<div sec:authorize="hasRole('ADMIN')">
    <h2>書籍新規登録</h2>
    <form id="book-form">
        <label for="title">タイトル:</label>
        <input type="text" id="title" name="title" required><br>
        <label for="author">著者:</label>
        <input type="text" id="author" name="author" required><br>
        <label for="publisher">出版社:</label>
        <input type="text" id="publisher" name="publisher" required><br>
        <label for="publishedDate">出版日:</label>
        <input type="date" id="publishedDate" name="publishedDate" required><br>
        <label for="stock">在庫数:</label>
        <input type="number" id="stock" name="stock" required><br>
        <button type="submit">新規登録</button>
    </form>
	</div>

	<script th:inline="javascript">
	    const currentUserRoles = /*[[${#authentication.authorities}]]*/ [];
	</script>
	
    <script>
		let currentParams=new URLSearchParams();
		
        // 書籍一覧取得
		function fetchBooks(queryString=''){
        fetch('/api/books/search'+(queryString ? '?'+queryString:''))
            .then(response => response.json())
            .then(books => {
				const isAdmin=currentUserRoles.some(role=>role.authority==='ROLE_ADMIN');
                let tbody = document.getElementById('book-table-body');
				tbody.innerHTML='';
                books.forEach(book => {
                    let row = `<tr>
                        <td>${book.id}</td>
                        <td>${book.title}</td>
                        <td>${book.author}</td>
                        <td>${book.publisher}</td>
                        <td>${book.publishedDate}</td>
                        <td>${book.stock}</td>`;
						
						if(isAdmin){	
                        row +=`<td>
                            <button onclick="updateBook(${book.id})">更新</button>
                            <button onclick="deleteBook(${book.id})">削除</button>
                        </td>`;
						}else{
							row+=`<td>-</td>`;
						}
						
                    row+=`</tr>`;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => console.error('Error fetching books:', error));
			}

        // 書籍新規登録
        document.getElementById('book-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const bookData = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                publisher: document.getElementById('publisher').value,
                publishedDate: document.getElementById('publishedDate').value,
                stock: document.getElementById('stock').value
            };

            fetch('/api/books', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bookData)
            })
            .then(response => response.json())
            .then(newBook => {
                alert('書籍が登録されました');
                location.reload(); // 登録後にページをリロードして新しいリストを反映
            })
            .catch(error => console.error('Error creating book:', error));
        });

        // 書籍更新
        function updateBook(bookId) {
            const updatedBookData = {
                title: prompt("新しいタイトルを入力してください"),
                author: prompt("新しい著者名を入力してください"),
                publisher: prompt("新しい出版社名を入力してください"),
                publishedDate: prompt("新しい出版日を入力してください"),
                stock: prompt("新しい在庫数を入力してください")
            };

            fetch(`/api/books/${bookId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedBookData)
            })
            .then(response => response.json())
            .then(updatedBook => {
                alert('書籍が更新されました');
                location.reload(); // 更新後にページをリロードして新しいリストを反映
            })
            .catch(error => console.error('Error updating book:', error));
        }

        // 書籍削除
        function deleteBook(bookId) {
            if (confirm("本当に削除しますか？")) {
                fetch(`/api/books/${bookId}`, {
                    method: 'DELETE'
                })
                .then(() => {
                    alert('書籍が削除されました');
                    location.reload(); // 削除後にページをリロードして新しいリストを反映
                })
                .catch(error => console.error('Error deleting book:', error));
            }
        }
		
		// リセットボタン
		function resetSearch(){
			document.getElementById('search-form').reset();
			currentParams=new URLSearchParams();
			fetchBooks();
		}
		
		//ソート機能
		function sortTable(field){
			const currentSort=currentParams.get("sort");
			let newSort;

				if (currentSort === field) {
					newSort = field + "_desc";
				} else if (currentSort === field + "_desc") {
					newSort = field; 
				} else {
					newSort = field;
				}
				
			currentParams.set("sort",newSort);
			fetchBooks(currentParams.toString());
		}
		
		window.onload=()=>{
			fetchBooks();
		}
		
		// 書籍検索
		function onSearch(event){
			event.preventDefault();
			
			const title=document.getElementById('search-title').value;
			const author=document.getElementById('search-author').value;
			const publisher=document.getElementById('search-publisher').value;
			const minStock=document.getElementById('search-minStock').value;
			const publishedDate=document.getElementById('search-publishedDate').value;
			
			const params=new URLSearchParams();
			if(title) params.set('title',title);
			if(author) params.set('author',author);
			if(publisher) params.set('publisher',publisher);
			if(minStock) params.set('minStock',minStock);
			if(publishedDate) params.set('publishedDate',publishedDate);

			currentParams=params;
			fetchBooks(currentParams.toString());
		}
    </script>

</body>
</html>
